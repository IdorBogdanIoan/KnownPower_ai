name: Analiza periferie (loturi)
run-name: lot ${{ inputs.rulare }}

on:
  workflow_dispatch:
    inputs:
      rulare:     { description: "nume rulare (a-z, 0-9, -)", required: true }
      localitati: { description: "localitati separate prin ;", required: true, default: "Bragadiru, Ilfov;Chiajna, Ilfov" }
      loturi:     { description: "cate joburi in paralel (max 20)", required: false, default: "20" }

permissions:
  contents: write

env:
  YOLO_CONFIG_DIR: /tmp/ultra
  GRIDTWIN_MS_LIVE: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      chunks: ${{ steps.p.outputs.chunks }}
    defaults: { run: { working-directory: ai } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/cache@v4
        with: { path: ai/cache_ms, key: cache-ms-v1 }
      - id: p
        env:
          LOCALITATI: ${{ inputs.localitati }}
          LOTURI: ${{ inputs.loturi }}
        run: python lot.py plan --localitati "$LOCALITATI" --chunks "$LOTURI" --out plan.json --osm-dir osm
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: |
            ai/plan.json
            ai/osm

  analiza:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.chunks) }}
    defaults: { run: { working-directory: ai } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - uses: actions/cache@v4
        with: { path: ai/cache_ms, key: cache-ms-v1 }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: { name: plan, path: ai }
      - env:
          CHUNK: ${{ matrix.chunk }}
        run: python lot.py run --plan plan.json --chunk "$CHUNK" --out "part_$CHUNK.json" --osm-dir osm
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "part-${{ matrix.chunk }}", path: "ai/part_*.json", if-no-files-found: ignore }

  merge:
    needs: analiza
    if: always() && needs.analiza.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: ai } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/download-artifact@v4
        with: { pattern: "part-*", path: ai/parts }
      - name: Uneste si verifica
        env: { RULARE: "${{ inputs.rulare }}" }
        run: |
          case "$RULARE" in *[!a-z0-9-]*|"") echo "nume de rulare invalid (doar a-z, 0-9, -)"; exit 1;; esac
          python lot.py merge --parts parts --rulare "$RULARE" --out "out/$RULARE"
      - name: Salveaza pe ramura rezultate
        env: { RULARE: "${{ inputs.rulare }}", GH_TOKEN: "${{ github.token }}" }
        run: bash salveaza_rezultate.sh "$RULARE" "out/$RULARE"
      - uses: actions/upload-artifact@v4
        with: { name: rezultat, path: ai/out }
