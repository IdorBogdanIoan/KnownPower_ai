name: Validare stalpi AI
run-name: validare ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ai
    env:
      YOLO_CONFIG_DIR: /tmp/ultra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - name: Instaleaza
        run: pip install -r requirements.txt
      - name: Valideaza
        run: python valideaza.py --out validare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validare
          path: ai/validare
